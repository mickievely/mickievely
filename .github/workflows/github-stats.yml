name: refresh github stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Include private commits
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/update_github_stats.py
      - name: Publish
        run: |
          git config user.name "mickievely"
          git config user.email "a01073352166a@gmail.com"
          git add github-stats.svg README.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: include private commits in GitHub stats"
          git push
