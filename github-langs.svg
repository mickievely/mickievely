<svg width="360" height="200" viewBox="0 0 360 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"><title>Most Used Languages</title><desc>C 61.36% , C++ 23.47% , HTML 5.34% , Python 3.57% , Luau 2.55% , JavaScript 1.55% , Lua 1.20% , CSS 0.96%</desc><style>
