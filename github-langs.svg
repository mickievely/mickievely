<svg width="360" height="250" viewBox="0 0 360 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"><title>Most Used Languages</title><desc>C 61.12% , C++ 23.38% , HTML 5.32% , Python 3.56% , Luau 2.54% , JavaScript 1.55% , Lua 1.20% , CSS 0.96% , Objective-C++ 0.13% , TypeScript 0.09% , PowerShell 0.05% , 그 외 0.10%</desc><style>
